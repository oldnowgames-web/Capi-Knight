<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Capi Knight</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Elemento invisível para forçar ativação imediata das 4 famílias de fontes no renderizador -->
    <div style="position: absolute; left: -9999px; top: -9999px; visibility: hidden; pointer-events: none;" aria-hidden="true">
      <span style="font-family: 'Daydream';">Daydream</span>
      <span style="font-family: 'KiwiSoda';">KiwiSoda</span>
      <span style="font-family: 'Pixelta';">Pixelta</span>
      <span style="font-family: 'Upheaval';">Upheaval</span>
    </div>
    <main class="game-shell" aria-label="Tech demo Capi Knight">
      <div class="game-stage">
        <canvas id="game" width="384" height="216" aria-label="Jogo Capi Knight"></canvas>
        <canvas id="ui-overlay" aria-hidden="true"></canvas>
      </div>
      <canvas id="touch-overlay" aria-hidden="true"></canvas>
      <p class="fallback">O navegador precisa oferecer suporte a Canvas 2D e JavaScript moderno.</p>
    </main>
    <!-- As 13 fases oficiais deste build estão embutidas no bundle. -->
    <!-- Bundle clássico: funciona inclusive ao abrir este arquivo via file://. -->
    <script defer src="./game.bundle.js"></script>
  </body>
</html>
